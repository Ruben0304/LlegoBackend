# CI del backend. Tres comprobaciones independientes:
#   1. pytest: falla solo ante fallos NUEVOS respecto a tests/known_failures.txt.
#   2. schema: compara el schema GraphQL del código con el de producción y falla ante
#      cambios incompatibles con los clientes publicados (campos quitados, tipos
#      endurecidos, ...), salvo que se permitan de forma consciente.
#   3. e2e: levanta el backend con el sandbox E2E y corre tests/e2e contra su API
#      (pedidos, pagos, permisos y carreras de punta a punta).
# Detalles y ejecución en local: sección "CI" de CLAUDE.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    # labeled/unlabeled: al poner o quitar la etiqueta `breaking-schema-ok` se vuelve a evaluar.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Variables de entorno de prueba: la app las exige al importarse, pero los tests no
  # llaman a Gemini ni a AWS. JWT_SECRET es un valor de prueba (no es ningún secreto real).
  MONGODB_URL: mongodb://localhost:27017
  MENU_TEST_MONGODB_URL: mongodb://localhost:27017
  GEMINI_API_KEY: test
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_DEFAULT_REGION: us-east-1
  AWS_ENDPOINT_URL: http://localhost
  S3_BUCKET_NAME: test
  JWT_SECRET: ci-test-jwt-secret-not-for-production-0123456789

jobs:
  tests:
    name: pytest (solo fallos nuevos)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping: 1})'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt pytest==9.1.1 pytest-asyncio==1.4.0

      - name: Ejecutar pytest contra la lista de fallos conocidos
        run: python scripts/ci/run_tests.py

  e2e:
    name: E2E contra el backend levantado (sandbox)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping: 1})'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # Clave de prueba del sandbox (no es ningún secreto): solo existe en este job.
      E2E_SANDBOX_KEY: ci-e2e-sandbox-key
      E2E_KEY: ci-e2e-sandbox-key
      E2E_BASE_URL: http://127.0.0.1:8000
      MONGODB_DATABASE: llego_ci
      ENVIRONMENT: development
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt pytest==9.1.1 pytest-asyncio==1.4.0

      - name: Levantar el backend
        run: |
          nohup uvicorn main:app --host 127.0.0.1 --port 8000 > backend.log 2>&1 &
          for i in $(seq 1 60); do
            curl -s -o /dev/null http://127.0.0.1:8000/graphql && exit 0
            sleep 1
          done
          cat backend.log
          exit 1

      - name: Ejecutar la suite E2E
        run: python -m pytest -q tests/e2e -p no:warnings

      - name: Log del backend si falla
        if: failure()
        run: tail -n 200 backend.log

  schema:
    name: Compatibilidad del schema con producción
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Comparar el schema del código con el de producción
        env:
          # Un cambio incompatible solo se permite de forma consciente:
          #   - en una PR: con la etiqueta `breaking-schema-ok`;
          #   - en cualquier evento: con la variable de repositorio ALLOW_BREAKING_SCHEMA=true;
          #   - en push a main y ejecuciones manuales solo se informa (la PR ya se revisó).
          ALLOW_BREAKING_SCHEMA: ${{ vars.ALLOW_BREAKING_SCHEMA == 'true' || github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'breaking-schema-ok') }}
          # Opcional: variable de repositorio para comparar contra otro entorno.
          LLEGO_GRAPHQL_URL: ${{ vars.LLEGO_GRAPHQL_URL }}
        run: python scripts/ci/check_schema_breaking.py
